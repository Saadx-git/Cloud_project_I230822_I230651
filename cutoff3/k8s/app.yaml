# CPU-bound workload service. Capacity C = CPU request / CPU per request (calibrated, see README).
apiVersion: apps/v1
kind: Deployment
metadata: {name: work, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: work}}
  template:
    metadata: {labels: {app: work}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: work
        image: pbscale/app:c3
        imagePullPolicy: Never
        env: [{name: WORK_ITERS, value: "40000"}]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 200m, memory: 96Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 1, failureThreshold: 1}
---
apiVersion: v1
kind: Service
metadata: {name: work, namespace: default}
spec:
  type: NodePort
  selector: {app: work}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
